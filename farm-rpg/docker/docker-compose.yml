# Lokale Dev-Umgebung (RTX 3070) für das Farm-RPG
#
#   docker compose up -d ollama open-webui          # lokales LLM + Chat-UI
#   docker compose --profile mcp up -d mcpo         # optional: Projektordner als Tool-Server für Open WebUI
#   docker compose run --rm agent tools/agent_task.sh TASK-0001   # Agent im Sandbox-Container
#
# Konfiguration über .env (Vorlage: .env.example).

name: farm-rpg

services:
  # ---------------------------------------------------------------- lokales LLM
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-10m}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [default, agent_net]

  # ------------------------------------------------- Chat/Planung (Open WebUI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      # Lokales Ollama und Dev-Server als zwei Verbindungen
      OLLAMA_BASE_URLS: "http://ollama:11434;http://${DEV_OLLAMA_HOST:-dev-server.invalid}:${DEV_OLLAMA_PORT:-11434}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------- Geteilter Projektzugriff: Dateisystem-MCP als OpenAPI-Server (optional)
  # In Open WebUI unter Einstellungen > Tools (Tool-Server) http://mcpo:8000 eintragen.
  # Projekt ist read-only gemountet, nur docs/ und tasks/ sind beschreibbar.
  mcpo:
    profiles: [mcp]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends nodejs npm \
         && rm -rf /var/lib/apt/lists/* \
         && pip install --no-cache-dir mcpo \
         && npm install -g @modelcontextprotocol/server-filesystem
        USER 1000:1000
        CMD ["mcpo", "--host", "0.0.0.0", "--port", "8000", "--", "mcp-server-filesystem", "/project"]
    restart: unless-stopped
    volumes:
      - ./:/project:ro
      - ./docs:/project/docs
      - ./tasks:/project/tasks

  # ------------------------------------------------------- Agent-Sandbox (aider)
  # Läuft im internen Netz agent_net: erreicht nur ollama und dev-ollama, kein Internet.
  agent:
    profiles: [agent]
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        GODOT_VERSION: "${GODOT_VERSION:-4.3}"
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    depends_on:
      - dev-ollama
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      OLLAMA_API_BASE: "${AGENT_OLLAMA_URL:-http://ollama:11434}"
      AIDER_MODEL: "${AGENT_MODEL:-ollama_chat/devstral-small-2-24b-instruct-2512-q3_k_l:latest}"
      AIDER_CHECK_UPDATE: "false"
      AIDER_ANALYTICS: "false"
      HOME: /home/agent
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 8g
    networks: [agent_net]

  # Brücke zum Dev-Server: macht ihn für die Sandbox unter http://dev-ollama:11434 erreichbar,
  # ohne der Sandbox allgemeinen Internetzugang zu geben.
  dev-ollama:
    profiles: [agent]
    image: alpine/socat:latest
    restart: unless-stopped
    command:
      - "TCP-LISTEN:11434,fork,reuseaddr"
      - "TCP:${DEV_OLLAMA_HOST:-dev-server.invalid}:${DEV_OLLAMA_PORT:-11434}"
    networks: [default, agent_net]

networks:
  default: {}
  agent_net:
    internal: true

volumes:
  ollama_models:
  open_webui_data:
